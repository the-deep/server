{{- if .Values.api.enabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "the-deep.fullname" . }}-api
  labels:
    app: {{ include "the-deep.fullname" . }}
    component: api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "the-deep.fullname" . }}
      component: api
  template:
    metadata:
      labels:
        app: {{ include "the-deep.fullname" . }}
        component: api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/config/secret.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/config/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ $.Values.image.name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.imagePullPolicy }}
          command: ["scripts/run_web.sh"]
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ template "the-deep.secretname" . }}
            - configMapRef:
                name: {{ template "the-deep.fullname" . }}-api-configmap

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end}}